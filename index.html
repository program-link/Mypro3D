<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Walking Game - Single File</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #info h3 { margin: 0 0 5px 0; font-size: 16px; }
        #info p { margin: 0; font-size: 13px; line-height: 1.4; color: #ccc; }
    </style>
</head>
<body>
    <div id="info">
        <h3>3D Exploration</h3>
        <p>W / A / S / D または 矢印キー: 移動<br>将来ここにテクスチャや壁を配置できます</p>
    </div>

    <!-- Three.js をCDNから直接読み込み（ターミナル不要） -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. シーン・カメラ・レンダラー
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e); // 深みのある夜空色

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. ライティング
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 3. 床の作成
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 4. 壁の作成（将来的にここに画像を貼り付けられます）
        const wallGeo = new THREE.BoxGeometry(6, 4, 0.5);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x4ecca3, roughness: 0.4 });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(0, 2, -8);
        scene.add(wall);

        // 5. 目印のオブジェクト
        const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0xe94560, roughness: 0.2 });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(3, 0.75, -3);
        scene.add(box);

        // 6. キーボード操作
        const keys = { W: false, A: false, S: false, D: false };
        window.addEventListener('keydown', (e) => updateKey(e, true));
        window.addEventListener('keyup', (e) => updateKey(e, false));

        function updateKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.W = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.A = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.S = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.D = isDown; break;
            }
        }

        // 7. アニメーションループ
        const speed = 0.08;
        function animate() {
            requestAnimationFrame(animate);

            if (keys.W) camera.position.z -= speed;
            if (keys.S) camera.position.z += speed;
            if (keys.A) camera.position.x -= speed;
            if (keys.D) camera.position.x += speed;

            renderer.render(scene, camera);
        }
        animate();

        // 8. 画面リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
